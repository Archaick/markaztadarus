    <!-- The loading screen: drawn before any script runs, and reused by

    <style>
      .mt-splash {
        position: fixed;
        inset: 0;
        z-index: 2000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: radial-gradient(ellipse 70% 60% at 50% 40%, #ffffff 0%, #f3f6fb 60%, #eaf0f8 100%);
        opacity: 0;
        animation: mt-splash-in 0.35s ease 0.15s forwards;
      }
      .mt-splash__mark {
        width: 84px;
        height: 84px;
        display: grid;
        place-items: center;
        border-radius: 24px;
        background: #fff;
        box-shadow: 0 18px 40px -18px rgba(16, 33, 65, 0.35), 0 0 0 1px rgba(184, 150, 12, 0.18);
        animation: mt-splash-breathe 1.8s ease-in-out infinite;
      }
      .mt-splash__mark img { width: 54px; height: 54px; }
      .mt-splash__name {
        margin: 0;
        font: 700 12px/1.4 "Outfit", "Inter", system-ui, sans-serif;
        letter-spacing: 0.24em;
        color: #1a4970;
      }
      .mt-splash__bar {
        position: relative;
        width: 132px;
        height: 3px;
        border-radius: 3px;
        overflow: hidden;
        background: rgba(26, 73, 112, 0.1);
      }
      .mt-splash__bar::after {
        content: "";
        position: absolute;
        inset: 0 auto 0 0;
        width: 40%;
        border-radius: 3px;
        background: linear-gradient(90deg, #e8c65a, #b8960c);
        animation: mt-splash-slide 1.1s ease-in-out infinite;
      }
      @keyframes mt-splash-in { to { opacity: 1; } }
      @keyframes mt-splash-breathe { 50% { transform: scale(1.05); } }
      @keyframes mt-splash-slide {
        from { transform: translateX(-100%); }
        to { transform: translateX(250%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .mt-splash, .mt-splash__mark, .mt-splash__bar::after { animation: none; opacity: 1; }
      }
    </style>
  </head>
